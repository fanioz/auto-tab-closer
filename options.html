<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Tutupen — Settings</title>
  <style>
    :root {
      --bg: #09090b;
      --surface: #18181b;
      --border: #27272a;
      --text: #f4f4f5;
      --text-muted: #a1a1aa;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
    }
    body {
      margin: 0;
      padding: 40px 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
    }
    .container {
      width: 100%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 16px;
    }
    .header h1 {
      font-size: 20px;
      font-weight: 600;
      margin: 0;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .card-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .form-label {
      font-size: 13px;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
    }
    .slider-row {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    input[type="range"] {
      flex: 1;
      accent-color: var(--primary);
    }
    .input-row {
      display: flex;
      gap: 8px;
    }
    input[type="text"] {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 13px;
      outline: none;
    }
    input[type="text"]:focus {
      border-color: var(--primary);
    }
    .btn {
      background: var(--primary);
      border: 1px solid var(--primary);
      color: white;
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
    }
    .btn:hover {
      background: var(--primary-hover);
    }
    .tag-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
    }
    .tag {
      background: var(--bg);
      border: 1px solid var(--border);
      padding: 4px 8px 4px 10px;
      border-radius: 4px;
      font-size: 12px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .tag-remove {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 12px;
      padding: 0;
    }
    .tag-remove:hover {
      color: #ef4444;
    }
    .toggle-row {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      cursor: pointer;
    }
    .toggle-row input[type="checkbox"] {
      width: 18px;
      height: 18px;
      margin-top: 2px;
      accent-color: var(--primary);
      flex-shrink: 0;
    }
    .toggle-text {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .toggle-text strong {
      font-size: 13px;
      font-weight: 600;
    }
    .toggle-text small {
      font-size: 11px;
      color: var(--text-muted);
      line-height: 1.5;
    }
    .status-msg {
      font-size: 12px;
      color: #10b981;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    .status-msg.show {
      opacity: 1;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <span style="font-size: 24px;">🧹</span>
      <h1>Tutupen Settings</h1>
    </div>

    <div class="card">
      <div class="card-title">Idle Threshold</div>
      <div class="form-group">
        <div class="form-label">
          <span>Close tabs idle for longer than:</span>
          <strong id="threshold-val" style="color: var(--text);">24 hours</strong>
        </div>
        <div class="slider-row">
          <input type="range" id="threshold-slider" min="1" max="168" value="24">
        </div>
        <div style="font-size: 11px; color: var(--text-muted);">
          Range: 1 hour up to 168 hours (7 days). Audible tabs are never closed; pinned tabs are protected by default (see Safety).
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">Safety</div>
      <label class="toggle-row">
        <input type="checkbox" id="protect-pinned" checked>
        <span class="toggle-text">
          <strong>Protect pinned tabs</strong>
          <small>Pinned tabs are never auto-closed. Turn off to let idle pinned tabs be closed too — pin means "keep this", so leave this on unless you really want the janitor to touch pins.</small>
        </span>
      </label>
    </div>

    <div class="card">
      <div class="card-title">Domain Exceptions</div>
      <div class="form-group">
        <label class="form-label">Never auto-close tabs matching these domains (e.g. github.com):</label>
        <div class="input-row">
          <input type="text" id="exception-input" placeholder="e.g. mail.google.com">
          <button class="btn" id="add-exception-btn">Add</button>
        </div>
        <div id="exceptions-container" class="tag-list"></div>
      </div>
    </div>

    <div style="display: flex; align-items: center; justify-content: space-between;">
      <button class="btn" id="save-btn">Save Settings</button>
      <span class="status-msg" id="status-msg">Settings saved successfully!</span>
    </div>
  </div>

  <script src="options.js"></script>
</body>
</html>
