<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Tutupen</title>
  <style>
    :root {
      --bg: #09090b;
      --surface: #18181b;
      --border: #27272a;
      --text: #f4f4f5;
      --text-muted: #a1a1aa;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
    }
    body {
      margin: 0;
      width: 340px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }
    .title {
      font-size: 14px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .actions-top {
      display: flex;
      gap: 8px;
    }
    .icon-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      width: 28px;
      height: 28px;
      border-radius: 4px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .icon-btn:hover {
      color: var(--text);
      border-color: var(--text-muted);
    }
    .current-tab-section {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      background: rgba(24, 24, 27, 0.5);
    }
    .btn {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.15s ease;
    }
    .btn:hover {
      background: var(--border);
    }
    .btn-primary {
      background: var(--primary);
      border-color: var(--primary);
      color: white;
    }
    .btn-primary:hover {
      background: var(--primary-hover);
    }
    .log-section {
      padding: 12px 16px;
      max-height: 260px;
      overflow-y: auto;
    }
    .section-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 8px;
    }
    .log-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .log-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      gap: 8px;
    }
    .tab-info {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow: hidden;
      flex: 1;
    }
    .tab-favicon {
      width: 14px;
      height: 14px;
      flex-shrink: 0;
    }
    .tab-title {
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--text);
    }
    .restore-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 11px;
      cursor: pointer;
      flex-shrink: 0;
    }
    .restore-btn:hover {
      color: var(--text);
      background: var(--border);
    }
    .empty-state {
      text-align: center;
      color: var(--text-muted);
      font-size: 12px;
      padding: 24px 0;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">
      <img src="icons/tutupen-32.png" alt="" style="width:18px;height:18px;vertical-align:-3px;">
      Tutupen
    </div>
    <div class="actions-top">
      <button class="icon-btn" id="open-options" title="Settings">
        ⚙️
      </button>
    </div>
  </div>

  <div class="current-tab-section">
    <button class="btn" id="exempt-current-btn">
      🛡️ Exempt Current Domain
    </button>
  </div>

  <div class="log-section">
    <div class="section-title">Recently Auto-Closed Tabs</div>
    <div id="log-container">
      <div class="empty-state">No auto-closed tabs yet</div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
